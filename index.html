<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JuniX</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="top-bar">
    <div class="logo">JuniX</div>

    <button id="searchBtn">🔎</button>
  </header>


  <main>

    <section class="welcome">
      <h1>Murakaza neza kuri JuniX 👋</h1>
      <p>Sangira ivyiyumviro, videos n'inkuru zawe.</p>
    </section>


    <section class="create-post">

      <h2>✨ Sangiza abandi</h2>

      <textarea
        id="postInput"
        placeholder="Andika ico ushaka gusangira..."
      ></textarea>

      <button id="postBtn">
        Post
      </button>

    </section>


    <section id="posts">

      <article class="post">

        <div class="post-header">
          <strong>JuniX</strong>
          <span>🌍</span>
        </div>

        <p>
          Murakaza neza! Iyi ni JuniX — urubuga rwacu rwo gusangira
          ivyiyumviro, inkuru na videos. 🚀
        </p>

        <div class="post-actions">

          <button class="likeBtn">
            ❤️ <span>0</span>
          </button>

          <button>
            💬 Comment
          </button>

          <button>
            📤 Share
          </button>

        </div>

      </article>

    </section>

  </main>


  <nav class="bottom-nav">

    <button>🏠<span>Home</span></button>

    <button>➕<span>Create</span></button>

    <button>🔔<span>Alerts</span></button>

    <button>👤<span>Profile</span></button>

  </nav>


  <script src="script.js"></script>

</body>
  </html>
